<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E7D32" />
  <title>Khet Saathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="phone">

  <!-- Passcode -->
  <section class="screen" id="s-pass" hidden>
    <div class="center-col">
      <div class="logo big" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 29V13"/><path d="M16 17c-6 0-9-4-9-9 6 0 9 4 9 9z"/><path d="M16 13c0-5 3-9 9-9 0 5-3 9-9 9z"/></svg></div>
      <h1 class="display" data-t="passcodeTitle"></h1>
      <label class="sr" for="passInput">Passcode</label>
      <input id="passInput" class="big-input" type="password" autocomplete="off" />
      <button id="passGo" class="btn primary wide" data-t="passcodeGo"></button>
    </div>
  </section>

  <!-- Language -->
  <section class="screen" id="s-lang" hidden>
    <div class="center-col">
      <div class="logo big" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 29V13"/><path d="M16 17c-6 0-9-4-9-9 6 0 9 4 9 9z"/><path d="M16 13c0-5 3-9 9-9 0 5-3 9-9 9z"/></svg></div>
      <h1 class="display">খেত সাথী · खेत साथी</h1>
      <p class="muted">ভাষা · भाषा · Language</p>
      <button class="btn lang-btn" data-lang="bn">বাংলা</button>
      <button class="btn lang-btn" data-lang="hi">हिंदी</button>
      <button class="btn lang-btn" data-lang="en">English</button>
    </div>
  </section>

  <!-- Home -->
  <section class="screen" id="s-home" hidden>
    <header class="top">
      <div>
        <div class="display xl"><span data-t="greet"></span> <span aria-hidden="true">·</span> <span data-t="appName"></span></div>
        <div class="muted" data-t="tagline"></div>
      </div>
      <button class="chip-btn" id="langSwitch" aria-label="Language"></button>
    </header>

    <div id="alertsBox" hidden>
      <h2 class="section-title alerts-head"><span data-t="alertsTitle"></span><span class="muted small" id="alertsCount"></span></h2>
      <div class="alert-list" id="alertList"></div>
    </div>

    <div class="kit" id="kitCard" hidden>
      <div class="kit-top"><span data-t="kitTitle"></span><span class="sample" data-t="simulated"></span></div>
      <div class="kit-grid" id="kitGrid"></div>
      <div class="muted small" id="kitWhen"></div>
    </div>

    <div class="tiles">
      <button class="tile tile-green" id="goEmpty">
        <svg class="tile-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18"/><path d="M12 19v-7"/><path d="M12 12c-3 0-5-2-5-5 3 0 5 2 5 5z"/><path d="M12 12c0-3 2-5 5-5 0 3-2 5-5 5z"/><circle cx="18.5" cy="4.5" r="1.5"/></svg>
        <span class="tile-title" data-t="newLand"></span>
        <span class="tile-sub" data-t="newLandSub"></span>
      </button>
      <button class="tile tile-yellow" id="goCrop">
        <svg class="tile-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V8"/><path d="M12 8c0-2.5 1.5-4.5 4-5 0 2.5-1.5 4.5-4 5z"/><path d="M12 12c-2.5 0-4-1.5-4.5-4 2.5 0 4 1.5 4.5 4z"/><path d="M12 15.5c2.5 0 4-1.5 4.5-4-2.5 0-4 1.5-4.5 4z"/></svg>
        <span class="tile-title" data-t="myCrop"></span>
        <span class="tile-sub" data-t="myCropSub"></span>
      </button>
      <button class="tile tile-plain" disabled>
        <span class="soon" data-t="soon"></span>
        <svg class="tile-ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 7a3 3 0 1 0-5.6 1.5C7 9.5 5 12 5 15a6 6 0 0 0 12 0c0-1.6-.5-3-1.4-4.1"/><path d="M19 7l2 1-2 1"/><path d="M9 21v-1M13 21v-1"/></svg>
        <span class="tile-title sm" data-t="poultry"></span>
      </button>
      <button class="tile tile-plain" disabled>
        <span class="soon" data-t="soon"></span>
        <svg class="tile-ico sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span class="tile-title sm" data-t="calendar"></span>
      </button>
    </div>

    <h2 class="section-title" data-t="myLands"></h2>
    <div id="landList" class="land-list"></div>

    <div id="homeAnswer" class="answer" hidden></div>
    <div class="spacer"></div>
  </section>

  <!-- Capture -->
  <section class="screen" id="s-capture" hidden>
    <header class="top">
      <button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="display lg" id="captureTitle"></div>
      <span></span>
    </header>

    <div class="card">
      <div class="card-title" data-t="step1"></div>
      <div class="photo-box" id="photoBox">
        <img id="photoPreview" alt="" hidden />
        <svg class="photo-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <label class="btn primary wide file-btn">
        <span id="photoBtnLabel" data-t="takePhoto"></span>
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
      </label>
      <div class="muted small center" data-t="photoOptional"></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="step2"></div>
      <div class="loc-row">
        <span id="locDot" class="dot wait" aria-hidden="true"></span>
        <span id="locText" class="loc-text"></span>
      </div>
      <div class="place-row" id="placeRow">
        <button class="pill" data-place="gps" data-t="useGps"></button>
        <button class="pill" data-place="bolpur"></button>
        <button class="pill" data-place="bogura"></button>
        <button class="pill" data-place="punjab"></button>
      </div>
    </div>

    <button id="analyseBtn" class="btn yellow wide xl-btn" data-t="analyse"></button>
  </section>

  <!-- Thinking -->
  <section class="screen" id="s-think" hidden>
    <div class="center-col">
      <div class="radar" aria-hidden="true"><span></span><span></span><span></span></div>
      <ol class="steps" id="steps">
        <li data-step="0"><span class="tick"></span><span data-t="stepSat"></span></li>
        <li data-step="1"><span class="tick"></span><span data-t="stepOutline"></span></li>
        <li data-step="2"><span class="tick"></span><span data-t="stepArea"></span></li>
        <li data-step="3"><span class="tick"></span><span data-t="stepSave"></span></li>
      </ol>
      <div class="muted small">Meta SAM 3.1 · Muse Spark</div>
    </div>
  </section>

  <!-- Land -->
  <section class="screen" id="s-land" hidden>
    <header class="top">
      <button class="round-btn" data-home aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="display lg" id="landTitle"></div>
      <button class="round-btn green" id="landListen" aria-label="Listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </header>

    <div class="map" id="map">
      <img id="mapImg" alt="" />
      <svg id="mapSvg" preserveAspectRatio="xMidYMid meet"></svg>
      <span class="map-badge" id="acresBadge"></span>
      <span class="map-badge right" id="demoBadge" hidden></span>
      <span class="map-badge scale" id="scaleBadge" hidden></span>
      <img id="mapPhoto" class="map-photo" alt="" hidden />
    </div>
    <div class="muted small center" id="mapHint"></div>

    <!-- Shown when no field outline was found: a town spot, or a land saved before v0.3.1 -->
    <div class="notice" id="landNotice" hidden>
      <div class="notice-head">
        <div class="notice-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div>
          <div class="notice-title" id="noticeTitle"></div>
          <p id="noticeText"></p>
        </div>
      </div>
      <button class="btn primary wide" id="demoBtn" data-t="showDemo"></button>
      <button class="btn wide" id="rescanBtn">
        <svg id="rescanIcoSearch" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <svg id="rescanIcoRetry" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>
        <span id="rescanLabel"></span>
      </button>
      <div class="tech" id="samLine"></div>
    </div>

    <button class="btn primary wide xl-btn" id="seePlanBtn" data-t="seePlan" hidden></button>

    <div class="stat-row" id="landStats">
      <div class="stat"><span class="stat-big" id="statAcres">—</span><span class="muted small" data-t="acres"></span></div>
      <div class="stat"><span class="stat-big" id="statFields">—</span><span class="muted small" data-t="fields"></span></div>
    </div>

    <h2 class="section-title" id="askTitle" data-t="askSaathi"></h2>
    <div class="chips" id="askChips"></div>
    <div id="landAnswer" class="answer" hidden></div>
    <div class="del-row"><button class="btn danger-ghost" id="deleteBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-t="deleteLand"></span></button></div>
    <div class="spacer"></div>
  </section>

  <!-- What to grow (Scenario 1) -->
  <section class="screen" id="s-plan" hidden>
    <header class="top">
      <button class="round-btn" id="planBack" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="display lg" data-t="planTitle"></div>
      <button class="round-btn green" id="planListen" aria-label="Listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </header>
    <div class="plot-row">
      <img id="planImg" alt="" />
      <div class="plot-main">
        <div class="plot-title" id="planPlotTitle"></div>
        <div class="soil-chips" id="planChips"></div>
      </div>
    </div>
    <div class="wx" id="planWx" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.5 9 3.5 3.5 0 0 1 17 16H7z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/></svg>
      <div class="wx-main">
        <b id="wxTitle"></b>
        <span id="wxText"></span>
        <div class="wx-days" id="wxDays"></div>
      </div>
    </div>
    <div class="muted small center" id="planLoading" data-t="loadingPlan" hidden></div>
    <div class="notice" id="planNotice" hidden>
      <div class="notice-head">
        <div class="notice-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div>
          <div class="notice-title" id="planNoticeTitle"></div>
          <p id="planNoticeText"></p>
        </div>
      </div>
    </div>
    <h2 class="section-title" id="planHead" hidden></h2>
    <div class="muted small" id="planZoneNote" hidden></div>
    <div class="crop-list" id="planCrops"></div>
    <div id="planAnswer" class="answer" hidden></div>
    <p class="credits" id="planCredits" data-t="credits"></p>
    <div class="spacer"></div>
  </section>

  <!-- Mic bar (home + land + plan) -->
  <div class="mic-bar" id="micBar" hidden>
    <button id="mic" class="mic" aria-label="Speak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div id="micLabel" class="mic-label" data-t="holdToTalk"></div>
  </div>

  <!-- Delete confirm sheet -->
  <div class="sheet-wrap" id="deleteSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="sheet-head">
        <img id="deleteThumb" alt="" />
        <div>
          <h3 id="deleteTitle" data-t="deleteTitle"></h3>
          <div class="muted" data-t="deleteText"></div>
        </div>
      </div>
      <button class="btn danger wide" id="deleteYes" data-t="deleteYes"></button>
      <button class="btn wide" id="deleteNo" data-t="deleteNo"></button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="i18n.js"></script>
<script src="farmer.js"></script>
</body>
</html>
